<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Asistente de envíos</title>
  <style>
    body { font: 13px system-ui, sans-serif; margin: 16px; min-width: 340px; color: #222; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    p { margin: 0 0 12px; color: #555; }
    label { display: block; margin-top: 10px; font-weight: 600; }
    input, select { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 3px; font: inherit; }
    #codigo { font: 600 20px ui-monospace, monospace; letter-spacing: 3px; text-transform: uppercase; text-align: center; padding: 8px; }
    small { color: #777; font-weight: 400; }
    button { margin-top: 12px; padding: 8px 14px; font: inherit; cursor: pointer; }
    #conectar { width: 100%; background: #059669; color: #fff; border: 0; border-radius: 6px; font-weight: 600; }
    #estado { margin-top: 12px; padding: 8px; background: #f5f5f5; border-radius: 6px; white-space: pre-wrap; }
    details { margin-top: 14px; color: #555; }
    summary { cursor: pointer; }
  </style>
</head>
<body>
  <h1>Asistente de envíos · El Comerciante Digital</h1>
  <p>Escribe el código de <b>Pagos ME → Conectar una PC</b>. Se hace una sola vez en cada cuenta de Chrome.</p>
  <input id="codigo" placeholder="ABCD-2345" maxlength="12" autocomplete="off">
  <button id="conectar">Conectar</button>
  <div id="estado">…</div>

  <details>
    <summary>Avanzado</summary>
    <label>Perfil <small>(nombre interno de este Chrome)</small>
      <input id="perfil" placeholder="se pone solo">
    </label>
    <label>Sistema
      <select id="servidor">
        <option value="https://app.elcomerciantedigital.com">Producción (app.elcomerciantedigital.com)</option>
        <option value="https://staging.elcomerciantedigital.com">Staging (pruebas)</option>
      </select>
    </label>
    <label>Clave del vigilante <small>(se pone sola al conectar con código)</small>
      <input id="clave" placeholder="me_…" autocomplete="off">
    </label>
    <label>Usuario:clave de staging <small>(solo para pruebas en staging)</small>
      <input id="basica" placeholder="usuario:clave" autocomplete="off">
    </label>
    <button id="guardar">Guardar</button>
    <button id="probar">Probar conexión</button>
  </details>
  <script src="opciones.js"></script>
</body>
</html>
