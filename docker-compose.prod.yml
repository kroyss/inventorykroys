services:
  inventory_next:
    container_name: inventory_next
    # Imagen con nombre: inventory_ecd usa la MISMA (se compila una sola vez).
    image: inventory_app:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Rotación de logs: máx. 10MB por archivo × 5 archivos = 50MB tope por contenedor.
    # Al llegar al límite, Docker rota y borra el más viejo. No llena el disco.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      # Toma el puerto del legacy (al que ya apunta el reverse proxy / dominio).
      # El legacy debe estar detenido para liberar 8501 antes de levantar.
      - "8501:3000"
    # El server está en hora europea (CEST); el negocio es VE/CO. Esto alinea logs
    # y cualquier `new Date()` del app a Caracas. (Las fechas críticas se calculan
    # por zona en código vía lib/tz.ts; toISOString ignora este TZ.)
    environment:
      - TZ=America/Caracas
      # Servicio de etiquetas del módulo Despachos (ver inventory_etiquetas abajo)
      - ETIQUETAS_URL=http://inventory_etiquetas:8000
    env_file:
      - .env.production
    depends_on:
      inventory_db:
        condition: service_healthy
    volumes:
      # Fotos/archivos de importaciones. El legacy las guarda DENTRO del contenedor
      # inventory_backend en /app/uploads (sin volumen). Para que el nuevo las vea,
      # se copian una vez al host y se montan aquí. UPLOAD_DIR=/app/uploads (env).
      # Paso único de migración en el VPS (antes de levantar):
      #   mkdir -p ./uploads
      #   docker cp inventory_backend:/app/uploads/. ./uploads/
      - ./uploads:/app/uploads
    networks:
      # Red del proyecto legacy (donde viven inventory_db_ve / inventory_db_co)
      # Si el nombre real es distinto, edítalo abajo y abajo del archivo.
      - inventory_net
    healthcheck:
      # Usar 127.0.0.1 (IPv4), NO localhost: en Alpine localhost resuelve primero
      # a ::1 (IPv6) y Next escucha en 0.0.0.0 (solo IPv4) → conexión rechazada.
      # -O /dev/null (no --spider): busybox wget da exit≠0 con --spider aunque responda.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # El Comerciante Digital (app.elcomerciantedigital.com, el portal): la MISMA app y la MISMA base,
  # con otra marca (MARCA=ecd) y su propia URL para NextAuth. Sesiones separadas por
  # dominio; los datos de cada empresa los separa la base (RLS), igual que en inventory.
  inventory_ecd:
    container_name: inventory_ecd
    image: inventory_app:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "127.0.0.1:8504:3000"
    env_file:
      - .env.production
    environment:
      - TZ=America/Caracas
      - ETIQUETAS_URL=http://inventory_etiquetas:8000
      - MARCA=ecd
      - NEXTAUTH_URL=https://app.elcomerciantedigital.com
    depends_on:
      inventory_next:
        condition: service_started
      inventory_db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    networks:
      - inventory_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Base COMPARTIDA multiempresa (desde el cambio, ver CORTE.md). Contenedor NUEVO y
  # aparte: las bases viejas inventory_db_ve / inventory_db_co (en /opt/inventory_web) no
  # se tocan y quedan como vuelta atrás. La app entra con el rol inventory_app (no salta
  # RLS); postgres solo lo usan los scripts de migración y respaldo.
  inventory_db:
    container_name: inventory_db
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${INVENTORY_DB_PASSWORD:?Falta INVENTORY_DB_PASSWORD en /opt/inventory_next/.env}
      - POSTGRES_DB=postgres
    volumes:
      - inventory_db_data:/var/lib/postgresql/data
    networks:
      - inventory_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Módulo Despachos: arma el PDF 4xA4 de etiquetas y el manifiesto con el MISMO código
  # de EtiquetasML / generar_manifiesto (PyMuPDF fijado en requirements.txt). Interno:
  # sin `ports`, solo lo alcanza inventory_next por la red. No guarda nada en disco.
  inventory_etiquetas:
    container_name: inventory_etiquetas
    build:
      context: ./services/etiquetas
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - inventory_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud', timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  inventory_db_data:

networks:
  inventory_net:
    external: true
    # Nombre real de la red de Docker donde corren inventory_db_ve / inventory_db_co.
    # Para descubrirlo en el VPS:
    #   docker inspect inventory_db_ve -f '{{json .NetworkSettings.Networks}}' | jq 'keys'
    # Si por ejemplo arroja "inventory_web_default", pon eso como name:
    name: inventory_web_inventory_network
